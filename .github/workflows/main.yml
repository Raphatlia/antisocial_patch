name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: https://github.com/theos/theos.git
          
      - name: Debug - list files
        run: |
          pwd
          ls -la
          find . -name "control" -type f
          
      - name: Fix line endings
        run: |
          dos2unix control || true
          dos2unix Makefile || true
          dos2unix Tweak.xm || true
          dos2unix antisocial_patch.plist || true
          echo "=== Проверка control ==="
          file control
          cat -A control | head -5
          
      - name: Build Tweak
        run: |
          export THEOS=${{ github.workspace }}/theos
          make clean
          make package
          
      - name: Find dylib and deb
        run: |
          echo "=== Поиск .dylib ==="
          find . -name "*.dylib" 2>/dev/null
          echo "=== Поиск .deb ==="
          find . -name "*.deb" 2>/dev/null
          echo "=== Содержимое .theos/obj ==="
          ls -la .theos/obj/ 2>/dev/null || echo "нет папки .theos/obj"
          echo "=== Содержимое packages ==="
          ls -la packages/ 2>/dev/null || echo "нет папки packages"
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antisocial_patch
          path: |
            .theos/obj/**/*.dylib
            .theos/obj/**/*.deb
            packages/*.deb
          if-no-files-found: warn
