name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: https://github.com/theos/theos.git
          
      - name: Debug - list files
        run: |
          pwd
          ls -la
          find . -name "control" -type f
          
      - name: Fix line endings
        run: |
          find . -name "control" -type f -exec dos2unix -v {} \;
          find . -name "*.plist" -type f -exec dos2unix -v {} \;
          find . -name "Makefile" -type f -exec dos2unix -v {} \;
          find . -name "*.xm" -type f -exec dos2unix -v {} \;
          
      - name: Build Tweak
        run: |
          export THEOS=${{ github.workspace }}/theos
          make clean
          make package
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antisocial_patch
          path: .theos/obj/*.dylib
          if-no-files-found: warn
